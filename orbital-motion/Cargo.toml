[package]
name = "orbital-motion"
version = "0.1.3"
edition = "2021"
categories = ["web-programming", "gui"]
keywords = ["leptos", "ui", "wasm", "components", "design-system"]
authors = ["Sean O'Rourke"]
documentation = "https://docs.rs/orbital-motion"
homepage = "https://unified-field-dev.github.io/orbital/"
repository = "https://github.com/unified-field-dev/orbital"
description = "Shared motion tokens, atoms, and presence utilities for Orbital"
license = "MIT"

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
leptos.workspace = true
leptos_transition_group = "0.2.0"
orbital-style = { path = "../orbital-style", version = "0.1.3", default-features = false }
orbital-macros = { path = "../orbital-macros", version = "0.1.4", optional = true }
turf.workspace = true
parcel_selectors = { workspace = true }
icondata.workspace = true
icondata_core.workspace = true
inventory = "0.3"
pulldown-cmark = { version = "0.13", optional = true }
wasm-bindgen = { workspace = true, optional = true }
web-sys = { workspace = true, features = ["CssStyleDeclaration", "Element", "EventTarget", "HtmlElement", "MediaQueryList", "Window"] }
send_wrapper = { version = "0.6", optional = true }

[features]
default = ["preview"]
preview = ["dep:orbital-macros", "dep:pulldown-cmark"]
hydrate = [
    "leptos/hydrate",
    "orbital-style/hydrate",
    "preview",
    "dep:pulldown-cmark",
    "dep:wasm-bindgen",
    "dep:send_wrapper",
]
ssr = ["leptos/ssr", "orbital-style/ssr", "preview", "dep:pulldown-cmark"]

[package.metadata.docs.rs]
all-features = false
rustdoc-args = ["--cfg", "docsrs"]
