# Debug variant of lanes.conf, for fixing one thing at a time: a one-file change
# rebuilds in about 30 s here, where the release build takes minutes.
#   LANES_CONF=lanes-debug.conf ./run-lanes.sh tests/components/card.spec.ts
# Debug assertions stay off: they turn on reactive_graph's console warnings, which the
# smoke specs treat as failures. opt-level 1 keeps hydration quick enough. Debug and
# release share target/site-preview, so switching between them rebuilds the site.
# shellcheck source=/dev/null
source "$here/lanes.conf"
BUILD_CMD="CARGO_PROFILE_DEV_DEBUG_ASSERTIONS=false CARGO_PROFILE_DEV_OPT_LEVEL=1 LEPTOS_BASE_PATH=/orbital ORBITAL_PREVIEW_BASE_PATH=/orbital cargo leptos build --project orbital-preview"
PROFILE=debug
LANES_DEFAULT=10
