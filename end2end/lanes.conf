# Settings for run-lanes.sh. Paths are relative to the repo root.
# A plain debug build makes a ~1.1 GB wasm, past Chromium's 1 GiB module limit,
# so the page never hydrates. opt-level 1 keeps it a dev build but small enough.
BUILD_CMD="CARGO_PROFILE_DEV_OPT_LEVEL=1 cargo leptos build --project orbital-preview"
PROFILE=debug
SERVER_BIN=orbital-preview-server     # under ${CARGO_TARGET_DIR:-target}/$PROFILE
SITE_ROOT=target/site-preview
OUTPUT_NAME=orbital-preview
PORT=3010                          # lane i serves on PORT + 100 + i
READY_PATH=/
SERVER_CWD=root                    # the server reads Cargo.toml and public/ from the repo root
SERVER_ENV=""
LANE_ENV=""                        # {port} is replaced with the lane's port
BASE_URL_VAR=COMPONENT_PREVIEW_BASE_URL
LANES_DEFAULT=8
# playwright.config.ts only defines projects when this is set (as `npm test` does).
export COMPONENT_PREVIEW_E2E=1
