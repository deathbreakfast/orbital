# Settings for run-lanes.sh. Paths are relative to the repo root.
# Release build, as ci.yml's e2e job: on a 16 vCPU host the release WASM hydrates fast
# enough for 14 lanes (full suite 2.2 min of lanes after a ~5 min warm build), where the
# debug build needed 10 lanes for 5.6 min. LANES_CONF can point at a debug variant.
BUILD_CMD="LEPTOS_BASE_PATH=/orbital ORBITAL_PREVIEW_BASE_PATH=/orbital cargo leptos build --release --project orbital-preview"
PROFILE=release
LEPTOS_ENV_MODE=PROD               # as ci.yml; DEV adds the live-reload websocket
SERVER_BIN=orbital-preview-server          # under ${CARGO_TARGET_DIR:-target}/$PROFILE
SITE_ROOT=target/site-preview
OUTPUT_NAME=orbital-preview
PORT=3010                          # lane i serves on PORT + 100 + i
READY_PATH=/orbital/pkg/orbital-preview.css   # static file; the catalog routes (/orbital vs /orbital/) differ on trailing slash
BASE_PATH=/orbital
BASE_URL_VAR=COMPONENT_PREVIEW_BASE_URL
SERVER_ENV="LEPTOS_BASE_PATH=/orbital ORBITAL_PREVIEW_BASE_PATH=/orbital"
LANE_ENV=""                        # {port} is replaced with the lane's port
LANES_DEFAULT=14   # lists in lanes/ are balanced for 14 from a release run
# playwright.config.ts defines no projects without this.
export COMPONENT_PREVIEW_E2E=1
# tests/helpers.ts reads the base path from the Playwright process, as in ci.yml.
export ORBITAL_PREVIEW_BASE_PATH=/orbital LEPTOS_BASE_PATH=/orbital

# The server copies public/orbital-theme-baseline.css (written by the build) into
# the site root at startup, relative to its working directory. Lanes start it in
# their own dir, so link the repo's public/ in; without the file the boot overlay
# reports "Unable to load application" on the first-paint stylesheet 404.
lane_setup() {
  mkdir -p "$3/srv"
  ln -sfn "$root/public" "$3/srv/public"
}

# Warm each lane's server and browser before its first spec. Without this the
# first spec of a lane can time out while the other lanes are still hydrating.
lane_warm() {
  ( cd "$here" && timeout 150 node warm.mjs "http://127.0.0.1:$2$BASE_PATH" ) >"$3/warm.log" 2>&1 || true
}
