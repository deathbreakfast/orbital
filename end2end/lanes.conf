# Settings for run-lanes.sh. Paths are relative to the repo root.
# The base path is compiled into the preview bundle, so the build sets it too.
BUILD_CMD="LEPTOS_BASE_PATH=/orbital ORBITAL_PREVIEW_BASE_PATH=/orbital LEPTOS_OUTPUT_NAME=orbital-preview cargo leptos build --project orbital-preview"
PROFILE=debug
SERVER_BIN=orbital-preview-server          # under ${CARGO_TARGET_DIR:-target}/$PROFILE
SITE_ROOT=target/site-preview
OUTPUT_NAME=orbital-preview
PORT=3010                          # lane i serves on PORT + 100 + i
READY_PATH=/orbital                # the preview server has no /health route
SERVER_ENV=""
LANE_ENV=""                        # {port} is replaced with the lane's port
LANES_DEFAULT=6    # 16 vCPU: 6 lanes ran clean at about 5 s per test; 8 and 12 starved hydration

# The specs' URL for lane i is http://$BASE_HOST:<port>$BASE_PATH, in $BASE_URL_VAR.
BASE_URL_VAR=COMPONENT_PREVIEW_BASE_URL
BASE_HOST=127.0.0.1
BASE_PATH=/orbital

# Exported, not in SERVER_ENV: `playwright test --list` needs these too, and
# without COMPONENT_PREVIEW_E2E the config declares no projects.
export COMPONENT_PREVIEW_E2E=1
export ORBITAL_PREVIEW_BASE_PATH=/orbital
export LEPTOS_BASE_PATH=/orbital

# The server copies public/orbital-theme-baseline.css into the site root at
# startup and looks for it relative to its cwd, as in ci.yml's run from the root.
SERVER_CWD=root
