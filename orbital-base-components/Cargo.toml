[package]
name = "orbital-base-components"
version = "0.1.4"
edition = "2021"
categories = ["web-programming", "gui"]
keywords = ["leptos", "ui", "wasm", "components", "design-system"]
authors = ["Sean O'Rourke"]
documentation = "https://docs.rs/orbital-base-components"
homepage = "https://unified-field-dev.github.io/orbital/"
repository = "https://github.com/unified-field-dev/orbital"
description = "Headless base primitives for Orbital — structure, semantics, and accessibility"
license = "MIT"

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
leptos.workspace = true
turf.workspace = true
parcel_selectors = { workspace = true }
icondata_core.workspace = true
icondata.workspace = true
chrono.workspace = true
reactive_stores = { version = "0.2", default-features = false }
uuid = { workspace = true }
wasm-bindgen = { workspace = true }
web-sys = { version = "0.3", features = ["CssStyleDeclaration", "DataTransfer", "Document", "DomRect", "Element", "Event", "EventTarget", "FileList", "HtmlDivElement", "HtmlElement", "HtmlInputElement", "HtmlTextAreaElement", "MediaQueryList", "Node", "NodeFilter", "Performance", "ScrollBehavior", "ScrollToOptions", "TreeWalker", "Window"] }
orbital-theme = { path = "../orbital-theme", version = "0.1.4", default-features = false }
orbital-style = { path = "../orbital-style", version = "0.1.4", default-features = false }
orbital-motion = { path = "../orbital-motion", version = "0.1.4", default-features = false }
orbital-data = { path = "../orbital-data", version = "0.1.4" }
send_wrapper = "0.6"
palette = "0.7"

[features]
default = []
hydrate = [
    "leptos/hydrate",
    "orbital-theme/hydrate",
    "orbital-style/hydrate",
    "orbital-motion/hydrate",
]
ssr = ["leptos/ssr", "orbital-theme/ssr", "orbital-style/ssr", "orbital-motion/ssr"]

[package.metadata.docs.rs]
all-features = false
no-default-features = true
rustdoc-args = ["--cfg", "docsrs"]
