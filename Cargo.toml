[workspace]
resolver = "2"
members = [
    "orbital",
    "orbital-shell",
    "orbital-macros",
    "orbital-core-components",
    "orbital-base-components",
    "orbital-style",
    "orbital-motion",
    "orbital-primitives",
    "orbital-datatable",
    "orbital-discussion",
    "orbital-history",
    "orbital-markdown",
    "orbital-charts",
    "orbital-date-pickers",
    "orbital-scheduler",
    "orbital-tree",
    "orbital-paging",
    "orbital-data",
    "component-preview-e2e",
    "orbital-theme",
    "orbital-preview-app",
    "orbital-preview-frontend",
    "orbital-preview-server",
    "examples/minimal-ssr-hydrate",
    "examples/authenticated-dashboard",
    "examples/server-paged-analytics",
]


[workspace.lints.rust]
unsafe_code = "forbid"
unused = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
redundant_locals = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
clone_on_copy = "allow"
module_inception = "allow"
unused_unit = "allow"

[workspace.metadata.dylint]
libraries = [{ git = "https://github.com/leptos-rs/leptos-lints", tag = "v0.1.2" }]

[profile.release]
codegen-units = 16
lto = "thin"
opt-level = "z"

[profile.dev]
incremental = true

[profile.dev.package."*"]
opt-level = 1

[workspace.dependencies]
leptos = { version = "0.8.20", default-features = false, features = ["nightly"] }
leptos_meta = { version = "0.8.6" }
leptos_router = { version = "0.8.14", features = ["nightly"] }
leptos_axum = { version = "0.8.10" }
leptos-use = { version = "0.18", default-features = false }
codee = { version = "0.3", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "wasmbind"] }

icondata = { version = "0.4.0", default-features = false, features = ["ant-design-icons", "box-icons", "lucide"] }
icondata_core = "0.1.0"

turf = "0.10"
# lightningcss 1.0.0-alpha.65 breaks with parcel_selectors 0.28.3 / cssparser 0.37.
# See commit message for provenance and unpin requirements.
parcel_selectors = "=0.28.2"

axum = "0.8.4"
cfg-if = "1.0.0"
console_error_panic_hook = "0.1.7"
console_log = "0.1.0"
http = "1.3.1"
log = "0.4.27"
simple_logger = "5.0.0"
tokio = { version = "1.45.0", features = ["full"] }
tower = { version = "0.5.2", features = ["full"] }
tower-http = { version = "0.6.4", features = ["full"] }
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "=0.4.76"
js-sys = "=0.3.103"
web-sys = "=0.3.103"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }

[[workspace.metadata.leptos]]
name = "orbital-preview"
output-name = "orbital-preview"
bin-package = "orbital-preview-server"
lib-package = "orbital-preview-frontend"
site-root = "target/site-preview"
site-pkg-dir = "pkg"
style-file = "style/main.scss"
assets-dir = "public"
site-addr = "127.0.0.1:3010"
reload-port = 3011
browserquery = "defaults"
watch = false
env = "DEV"
bin-features = ["ssr"]
lib-features = ["hydrate"]
bin-default-features = false
lib-default-features = false
# Avoid cargo-leptos RUSTFLAGS overwrite / erase_components skew with leptos 0.8.20
# (`__as_shared_reactive_fn` configured out while leptos_macro still erases).
disable-erase-components = true
# `cargo leptos end-to-end --project orbital-preview` serves on site-addr (:3010) then runs
# `npm test` in end2end/ (COMPONENT_PREVIEW_E2E=1 + Playwright baseURL :3010).
end2end-cmd = "npm test"
end2end-dir = "end2end"

[[workspace.metadata.leptos]]
name = "minimal-ssr-hydrate"
output-name = "minimal-ssr-hydrate"
bin-package = "minimal-ssr-hydrate"
lib-package = "minimal-ssr-hydrate"
site-root = "examples/minimal-ssr-hydrate/site"
site-pkg-dir = "pkg"
style-file = "examples/minimal-ssr-hydrate/style/main.scss"
assets-dir = "public"
site-addr = "127.0.0.1:3030"
reload-port = 3035
bin-features = ["ssr"]
lib-features = ["hydrate"]
bin-default-features = false
lib-default-features = false

[[workspace.metadata.leptos]]
name = "authenticated-dashboard"
output-name = "authenticated-dashboard"
bin-package = "authenticated-dashboard"
lib-package = "authenticated-dashboard"
site-root = "examples/authenticated-dashboard/site"
site-pkg-dir = "pkg"
style-file = "examples/authenticated-dashboard/style/main.scss"
assets-dir = "public"
site-addr = "127.0.0.1:3031"
reload-port = 3036
bin-features = ["ssr"]
lib-features = ["hydrate"]
bin-default-features = false
lib-default-features = false

[[workspace.metadata.leptos]]
name = "server-paged-analytics"
output-name = "server-paged-analytics"
bin-package = "server-paged-analytics"
lib-package = "server-paged-analytics"
site-root = "examples/server-paged-analytics/site"
site-pkg-dir = "pkg"
style-file = "examples/server-paged-analytics/style/main.scss"
assets-dir = "public"
site-addr = "127.0.0.1:3032"
reload-port = 3037
bin-features = ["ssr"]
lib-features = ["hydrate"]
bin-default-features = false
lib-default-features = false
