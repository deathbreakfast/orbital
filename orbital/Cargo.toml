[package]
name = "orbital-ui"
version = "0.1.3"
edition = "2021"
categories = ["web-programming", "gui"]
keywords = ["leptos", "ui", "wasm", "components", "design-system"]
documentation = "https://docs.rs/orbital-ui"
homepage = "https://unified-field-dev.github.io/orbital/"
license = "MIT"
description = "Leptos component library and design system for focused, accessible product UIs"
repository = "https://github.com/unified-field-dev/orbital"
authors = ["Sean O'Rourke"]
readme = "README.md"

[lints]
workspace = true

[lib]
name = "orbital"
doctest = false

[dependencies]
leptos.workspace = true
leptos_meta.workspace = true
leptos_router.workspace = true
leptos_axum = { workspace = true, optional = true }
axum = { workspace = true, optional = true }

icondata.workspace = true
icondata_core.workspace = true

turf.workspace = true
parcel_selectors = { workspace = true }

http.workspace = true
cfg-if.workspace = true
url = { version = "2" }
urlencoding = "2.1"

serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, optional = true }

inventory = "0.3"
pulldown-cmark = "0.13"

orbital-macros = { path = "../orbital-macros", version = "0.1.4" }
orbital-shell = { path = "../orbital-shell", version = "0.1.3", default-features = false }
orbital-base-components = { path = "../orbital-base-components", version = "0.1.3" }
orbital-primitives = { path = "../orbital-primitives", version = "0.1.3", default-features = false }
orbital-core-components = { path = "../orbital-core-components", version = "0.1.3", default-features = false }
orbital-theme = { path = "../orbital-theme", version = "0.1.3", default-features = false }
orbital-style = { path = "../orbital-style", version = "0.1.3", default-features = false }
orbital-paging = { path = "../orbital-paging", version = "0.1.3", default-features = false, features = ["leptos"] }
orbital-motion = { path = "../orbital-motion", version = "0.1.3", default-features = false }

wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
web-sys = { version = "0.3", features = ["Document", "Element", "HtmlElement", "Window", "MediaQueryList", "Event", "Storage", "History"] }

[build-dependencies]
orbital-theme = { path = "../orbital-theme", version = "0.1.3", default-features = false }

[features]
default = ["preview"]
preview = ["orbital-core-components/preview", "orbital-primitives/preview"]
hydrate = [
    "leptos/hydrate",
    "orbital-base-components/hydrate",
    "orbital-primitives/hydrate",
    "orbital-theme/hydrate",
    "orbital-style/hydrate",
    "orbital-shell/hydrate",
    "orbital-paging/hydrate",
    "preview",
]
ssr = [
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "dep:leptos_axum",
    "orbital-base-components/ssr",
    "orbital-primitives/ssr",
    "orbital-theme/ssr",
    "orbital-style/ssr",
    "orbital-shell/ssr",
    "dep:tokio",
    "dep:axum",
    "orbital-paging/ssr",
    "preview",
]

[package.metadata.turf]
minify = true
load_paths = ["src/styles"]

[package.metadata.turf.class_names]
# Include stylesheet hash so identical local names (e.g. `.Root`) do not collide
# across components in release builds (debug turf-dev already scopes by sheet).
template = "<original_name>-<name_hash_short>-<style_sheet_hash_short>"
excludes = ["^orbital-.*"]

[package.metadata.turf-dev]
minify = false

[package.metadata.docs.rs]
all-features = false
rustdoc-args = ["--cfg", "docsrs"]
