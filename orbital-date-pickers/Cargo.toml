[package]
name = "orbital-date-pickers"
version = "0.1.3"
edition = "2021"
readme = "README.md"
categories = ["web-programming", "gui"]
keywords = ["leptos", "ui", "wasm", "components", "design-system"]
authors = ["Sean O'Rourke"]
documentation = "https://docs.rs/orbital-date-pickers"
homepage = "https://unified-field-dev.github.io/orbital/"
repository = "https://github.com/unified-field-dev/orbital"
description = "Date and time picker components for Orbital"
license = "MIT"

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
leptos.workspace = true
orbital-base-components = { path = "../orbital-base-components", version = "0.1.3" }
orbital-core-components = { path = "../orbital-core-components", version = "0.1.3", default-features = false }
orbital-macros = { path = "../orbital-macros", version = "0.1.4" }
orbital-theme = { path = "../orbital-theme", version = "0.1.3", default-features = false }
icondata.workspace = true
icondata_core.workspace = true
bitflags = "2"
chrono.workspace = true
turf.workspace = true
inventory = { version = "0.3", optional = true }
wasm-bindgen = { workspace = true }
web-sys = { version = "0.3", features = ["Document", "HtmlElement", "Window"] }

[features]
default = ["preview"]
preview = ["dep:inventory", "orbital-core-components/preview"]
hydrate = ["leptos/hydrate", "orbital-core-components/hydrate", "orbital-theme/hydrate", "preview", "dep:inventory"]
ssr = ["leptos/ssr", "orbital-core-components/ssr", "orbital-theme/ssr", "preview", "dep:inventory"]

[package.metadata.docs.rs]
all-features = false
rustdoc-args = ["--cfg", "docsrs"]
