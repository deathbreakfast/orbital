[package]
name = "orbital-preview-app"
version = "0.1.4"
edition = "2021"
publish = false
license = "MIT"
description = "Leptos app shell for the Orbital component preview catalog."

[lints]
workspace = true

[dependencies]
leptos.workspace = true
leptos_meta.workspace = true
leptos_router.workspace = true
icondata.workspace = true
icondata_core.workspace = true
turf.workspace = true
parcel_selectors = { workspace = true }

orbital = { package = "orbital-ui", path = "../orbital", version = "0.1.4", default-features = false }
orbital-base-components = { path = "../orbital-base-components", version = "0.1.4" }
orbital-macros = { path = "../orbital-macros", version = "0.1.5" }
orbital-primitives = { path = "../orbital-primitives", version = "0.1.4", default-features = false }
orbital-theme = { path = "../orbital-theme", version = "0.1.4", default-features = false }
orbital-style = { path = "../orbital-style", version = "0.1.4", default-features = false }
orbital-core-components = { path = "../orbital-core-components", version = "0.1.4", default-features = false }
orbital-datatable = { path = "../orbital-datatable", version = "0.1.4", default-features = false }
orbital-date-pickers = { path = "../orbital-date-pickers", version = "0.1.4", default-features = false }
orbital-charts = { path = "../orbital-charts", version = "0.1.4", default-features = false }
orbital-tree = { path = "../orbital-tree", version = "0.1.4", default-features = false }
orbital-scheduler = { path = "../orbital-scheduler", version = "0.1.4", default-features = false }
orbital-discussion = { path = "../orbital-discussion", version = "0.1.4", default-features = false }
orbital-history = { path = "../orbital-history", version = "0.1.4", default-features = false }
orbital-motion = { path = "../orbital-motion", version = "0.1.4", default-features = false }
component-preview-e2e = { path = "../component-preview-e2e", version = "0.1.4" }

[features]
default = []
hydrate = [
    "leptos/hydrate",
    "orbital/hydrate",
    "orbital/preview",
    "orbital-base-components/hydrate",
    "orbital-primitives/hydrate",
    "orbital-primitives/preview",
    "orbital-core-components/hydrate",
    "orbital-core-components/preview",
    "orbital-theme/hydrate",
    "orbital-style/hydrate",
    "orbital-datatable/hydrate",
    "orbital-datatable/preview",
    "orbital-date-pickers/hydrate",
    "orbital-date-pickers/preview",
    "orbital-charts/hydrate",
    "orbital-charts/preview",
    "orbital-charts/datatable-integration",
    "orbital-tree/hydrate",
    "orbital-tree/preview",
    "orbital-scheduler/hydrate",
    "orbital-scheduler/preview",
    "orbital-discussion/hydrate",
    "orbital-discussion/preview",
    "orbital-history/hydrate",
    "orbital-history/preview",
    "orbital-motion/hydrate",
    "orbital-motion/preview",
]
ssr = [
    "leptos/ssr",
    "leptos_meta/ssr",
    "leptos_router/ssr",
    "orbital/ssr",
    "orbital/preview",
    "orbital-base-components/ssr",
    "orbital-primitives/ssr",
    "orbital-primitives/preview",
    "orbital-core-components/ssr",
    "orbital-core-components/preview",
    "orbital-theme/ssr",
    "orbital-style/ssr",
    "orbital-datatable/ssr",
    "orbital-datatable/preview",
    "orbital-date-pickers/ssr",
    "orbital-date-pickers/preview",
    "orbital-charts/ssr",
    "orbital-charts/preview",
    "orbital-charts/datatable-integration",
    "orbital-tree/ssr",
    "orbital-tree/preview",
    "orbital-scheduler/ssr",
    "orbital-scheduler/preview",
    "orbital-discussion/ssr",
    "orbital-discussion/preview",
    "orbital-history/ssr",
    "orbital-history/preview",
    "orbital-motion/ssr",
    "orbital-motion/preview",
]

[package.metadata.turf]
minify = true
load_paths = ["src/styles"]

[package.metadata.turf-dev]
minify = false
