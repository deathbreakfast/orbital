[package]
name = "orbital-history"
version = "0.1.1"
edition = "2021"
license = "MIT"

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
leptos.workspace = true
bitflags = "2"
chrono.workspace = true
serde = { workspace = true, features = ["derive"] }
orbital-base-components = { path = "../orbital-base-components" }
orbital-core-components = { path = "../orbital-core-components", default-features = false }
orbital-paging = { path = "../orbital-paging", features = ["leptos"] }
orbital-macros = { path = "../orbital-macros" }
orbital-style = { path = "../orbital-style" }
orbital-theme = { path = "../orbital-theme", default-features = false }
orbital-markdown = { path = "../orbital-markdown" }
inventory = { version = "0.3", optional = true }
icondata.workspace = true
icondata_core.workspace = true
wasm-bindgen = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
send_wrapper = { version = "0.6", optional = true }
web-sys = { workspace = true, optional = true, features = ["Element", "HtmlElement", "ResizeObserver", "ResizeObserverEntry", "DomRect"] }
gloo-timers = { version = "0.3", optional = true }

[features]
default = ["preview"]
preview = ["dep:inventory", "orbital-core-components/preview"]
hydrate = [
    "leptos/hydrate",
    "orbital-core-components/hydrate",
    "orbital-theme/hydrate",
    "orbital-paging/hydrate",
    "preview",
    "dep:inventory",
  "dep:wasm-bindgen",
  "dep:js-sys",
  "dep:send_wrapper",
  "dep:web-sys",
  "dep:gloo-timers",
]
ssr = [
    "leptos/ssr",
    "orbital-core-components/ssr",
    "orbital-theme/ssr",
    "orbital-paging/ssr",
    "preview",
    "dep:inventory",
]
