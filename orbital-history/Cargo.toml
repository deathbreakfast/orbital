[package]
name = "orbital-history"
version = "0.1.4"
edition = "2021"
readme = "README.md"
categories = ["web-programming", "gui"]
keywords = ["leptos", "ui", "wasm", "components", "design-system"]
authors = ["Sean O'Rourke"]
documentation = "https://docs.rs/orbital-history"
homepage = "https://unified-field-dev.github.io/orbital/"
repository = "https://github.com/unified-field-dev/orbital"
description = "Composable audit history timeline components for Orbital"
license = "MIT"

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
leptos.workspace = true
bitflags = "2"
chrono.workspace = true
serde = { workspace = true, features = ["derive"] }
orbital-base-components = { path = "../orbital-base-components", version = "0.1.4" }
orbital-core-components = { path = "../orbital-core-components", version = "0.1.4", default-features = false }
orbital-paging = { path = "../orbital-paging", version = "0.1.4", features = ["leptos"] }
orbital-macros = { path = "../orbital-macros", version = "0.1.5" }
orbital-style = { path = "../orbital-style", version = "0.1.4" }
orbital-theme = { path = "../orbital-theme", version = "0.1.4", default-features = false }
orbital-markdown = { path = "../orbital-markdown", version = "0.1.4" }
inventory = { version = "0.3", optional = true }
icondata.workspace = true
icondata_core.workspace = true
wasm-bindgen = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
send_wrapper = { version = "0.6", optional = true }
web-sys = { workspace = true, optional = true, features = ["Element", "HtmlElement", "ResizeObserver", "ResizeObserverEntry", "DomRect"] }
gloo-timers = { version = "0.3", optional = true }

[features]
default = ["preview"]
preview = ["dep:inventory", "orbital-core-components/preview"]
hydrate = [
    "leptos/hydrate",
    "orbital-core-components/hydrate",
    "orbital-theme/hydrate",
    "orbital-paging/hydrate",
    "preview",
    "dep:inventory",
  "dep:wasm-bindgen",
  "dep:js-sys",
  "dep:send_wrapper",
  "dep:web-sys",
  "dep:gloo-timers",
]
ssr = [
    "leptos/ssr",
    "orbital-core-components/ssr",
    "orbital-theme/ssr",
    "orbital-paging/ssr",
    "preview",
    "dep:inventory",
]

[package.metadata.docs.rs]
all-features = false
rustdoc-args = ["--cfg", "docsrs"]
