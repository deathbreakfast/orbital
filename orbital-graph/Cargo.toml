[package]
name = "orbital-graph"
version = "0.1.4"
edition = "2021"
categories = ["web-programming", "gui"]
keywords = ["leptos", "ui", "wasm", "graph", "design-system"]
authors = ["Sean O'Rourke"]
documentation = "https://docs.rs/orbital-graph"
homepage = "https://unified-field-dev.github.io/orbital/"
repository = "https://github.com/unified-field-dev/orbital"
description = "Dependency graph layout for Orbital"
license = "MIT"

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
leptos.workspace = true
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = ["DomRect", "Element", "SvgElement"] }
orbital-base-components = { path = "../orbital-base-components", version = "0.1.4" }
orbital-core-components = { path = "../orbital-core-components", version = "0.1.4", default-features = false }
orbital-macros = { path = "../orbital-macros", version = "0.1.5" }
orbital-style = { path = "../orbital-style", version = "0.1.4" }
orbital-theme = { path = "../orbital-theme", version = "0.1.4", default-features = false }
icondata.workspace = true
inventory = { version = "0.3", optional = true }

[features]
default = ["preview"]
preview = ["dep:inventory", "orbital-core-components/preview"]
hydrate = ["leptos/hydrate", "orbital-core-components/hydrate", "orbital-theme/hydrate", "preview"]
ssr = ["leptos/ssr", "orbital-core-components/ssr", "orbital-theme/ssr", "preview"]

[package.metadata.docs.rs]
all-features = false
rustdoc-args = ["--cfg", "docsrs"]
