[package]
name = "component-preview-e2e"
version = "0.1.3"
edition = "2021"
publish = false

[lints]
workspace = true

[features]
default = ["preview"]
preview = []

[dependencies]
orbital = { package = "orbital-ui", path = "../orbital", version = "0.1.3", default-features = false, features = ["preview"] }
orbital-base-components = { path = "../orbital-base-components", version = "0.1.3" }
orbital-core-components = { path = "../orbital-core-components", version = "0.1.3", default-features = false, features = ["preview"] }
orbital-macros = { path = "../orbital-macros", version = "0.1.4" }
leptos = { workspace = true, default-features = false, features = ["csr"] }
icondata.workspace = true

[dev-dependencies]
trybuild = "1.0"
