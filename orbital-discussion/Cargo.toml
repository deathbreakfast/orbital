[package]
name = "orbital-discussion"
version = "0.1.1"
edition = "2021"
readme = "README.md"
categories = ["web-programming", "gui"]
keywords = ["leptos", "ui", "wasm", "components", "design-system"]
authors = ["Sean O'Rourke"]
documentation = "https://docs.rs/orbital-discussion"
homepage = "https://unified-field-dev.github.io/orbital/"
repository = "https://github.com/unified-field-dev/orbital"
description = "Composable discussion and reply-thread components for Orbital"
license = "MIT"

[lints]
workspace = true

[lib]
doctest = false

[dependencies]
ammonia = "4.1.4"
bitflags = "2"
chrono.workspace = true
orbital-markdown = { path = "../orbital-markdown", version = "0.1.1" }
pulldown-cmark = "0.13"
leptos.workspace = true
serde.workspace = true
serde_json.workspace = true
wasm-bindgen = { workspace = true, optional = true }
js-sys = { workspace = true, optional = true }
web-sys = { workspace = true, optional = true, features = ["Document", "Element", "File", "FileList", "HtmlElement", "HtmlInputElement", "HtmlTextAreaElement"] }
orbital-base-components = { path = "../orbital-base-components", version = "0.1.1" }
orbital-core-components = { path = "../orbital-core-components", version = "0.1.1", default-features = false }
orbital-macros = { path = "../orbital-macros", version = "0.1.2" }
orbital-style = { path = "../orbital-style", version = "0.1.1" }
orbital-theme = { path = "../orbital-theme", version = "0.1.1", default-features = false }
icondata.workspace = true
icondata_core.workspace = true
inventory = { version = "0.3", optional = true }

[features]
default = ["preview"]
preview = ["dep:inventory", "orbital-core-components/preview"]
hydrate = ["leptos/hydrate", "orbital-core-components/hydrate", "orbital-theme/hydrate", "preview", "dep:inventory", "dep:wasm-bindgen", "dep:js-sys", "dep:web-sys"]
ssr = ["leptos/ssr", "orbital-core-components/ssr", "orbital-theme/ssr", "preview", "dep:inventory"]

[package.metadata.docs.rs]
all-features = false
rustdoc-args = ["--cfg", "docsrs"]
